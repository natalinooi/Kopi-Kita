<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="100%" height="100%">
  <g transform="translate(15, 20)">
    <!-- Brand Mark: Modern Artisanal Coffee Bean / Dripper Icon -->
    <path d="M 50 15 C 24 15 12 40 12 70 C 12 102 32 120 50 120 C 68 120 88 102 88 70 C 88 40 76 15 50 15 Z" fill="none" stroke="#2B170B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vertical extraction dots / steam line -->
    <circle cx="50" cy="45" r="4.5" fill="#2B170B" />
    <circle cx="50" cy="65" r="4.5" fill="#2B170B" />
    <circle cx="50" cy="85" r="4.5" fill="#2B170B" />
    <circle cx="50" cy="103" r="3" fill="#2B170B" />
